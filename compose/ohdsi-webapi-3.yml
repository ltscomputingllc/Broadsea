version: '3.9'

# Broadsea service override for OHDSI WebAPI 3.0 (Spring Boot 3.x JAR, Java 21).
# Standalone definition (does NOT extend compose/ohdsi-webapi.yml, which targets 2.x).
# Used by the "webapi-3" profile in docker-compose.yml. Auth is left fully disabled for
# the smoke test.

services:

  ohdsi-webapi-3:
    # keep the 2.x container name so the Traefik router/service "ohdsi-webapi"
    # (http://ohdsi-webapi:8080) continues to resolve unchanged
    container_name: ohdsi-webapi
    platform: ${DOCKER_ARCH}
    restart: unless-stopped
    ipc: none
    read_only: true
    privileged: false
    depends_on:
      broadsea-atlasdb:
        condition: service_healthy
    tmpfs:
      - /tmp
      # 3.0 writes logs here; explicit uid/gid so the read-only-fs tmpfs is writable
      # by the image's USER 101 (a plain tmpfs would be root-owned)
      - /var/lib/ohdsi/webapi/logs:uid=101,gid=101,mode=0755
    volumes:
      - ../webapi/docker-entrypoint-3.sh:/entrypoint.sh
      - ${WEBAPI_CACERTS_FILE}:/tmp/cacerts
    entrypoint: ["/bin/sh","/entrypoint.sh"]
    secrets:
      - WEBAPI_DATASOURCE_PASSWORD
    # All non-secret app config now lives in env/webapi-3.env, injected via env_file declared
    # on the ohdsi-webapi-3 service in docker-compose.yml. The DB password is still supplied
    # from the Docker secret by webapi/docker-entrypoint-3.sh (DATASOURCE_PASSWORD /
    # SPRING_FLYWAY_PASSWORD). Auth is left disabled (no SECURITY_AUTH_* set).
    labels:
      - "traefik.enable=true"
