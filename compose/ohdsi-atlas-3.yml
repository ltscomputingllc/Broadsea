version: '3.9'

# Broadsea service override for OHDSI Atlas3 (Vue3/Vuetify/Vite SPA).
# Used by the "atlas-3" profile in docker-compose.yml. The image is a Caddy static
# file-server listening on :8080 (built by ./atlas-3/Dockerfile); Traefik terminates
# TLS and routes /atlas -> ohdsi-atlas:8080 and /WebAPI -> the webapi-3 service.
# Runtime config is the baked /srv/atlas/config-local.json — no env-var config, no
# published ports (Traefik reaches :8080 over the internal network).

services:

  ohdsi-atlas-3:
    # keep the 2.x container name so the Traefik router/service "ohdsi-atlas"
    # (http://ohdsi-atlas:8080, path /atlas) continues to resolve unchanged
    container_name: ohdsi-atlas
    platform: ${DOCKER_ARCH}
    restart: unless-stopped
    ipc: none
    privileged: false
    labels:
      - "traefik.enable=true"
    # Optional per-host config override (no rebuild): uncomment to serve a custom
    # config-local.json (e.g. additional auth providers or a different api.url).
    # volumes:
    #   - ./atlas-3/config-local.json:/srv/atlas/config-local.json:ro
